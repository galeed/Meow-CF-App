# Meow CF App - Capacitor CLI APK Build Workflow
name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Capacitor CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MeowCF" "com.meowcf.meowcf" --web-dir ./
          npx cap add android
          npx cap copy

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generada
        uses: actions/upload-artifact@v4
        with:
          name: meowcf-capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
