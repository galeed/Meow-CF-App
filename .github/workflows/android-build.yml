name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Configurar Java JDK (requerido para compilar Android)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Configurar el SDK de Android
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 5. Inicializar npm e instalar Capacitor
      - name: Instalar dependencias de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Inicializar y sincronizar Capacitor con el proyecto web
      - name: Inicializar Capacitor y Agregar Plataforma Android
        run: |
          npx cap init "Meow CF App" "com.meowcf.app" --web-dir .
          npx cap add android
          npx cap sync android

      # 7. Dar permisos de ejecución al ejecutable de Gradle
      - name: Permisos Gradle
        run: chmod +x android/gradlew

      # 8. Compilar la APK en modo Debug
      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      # 9. Subir la APK generada como Artefacto para descargar desde GitHub
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
