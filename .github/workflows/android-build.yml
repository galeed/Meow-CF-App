name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Configurar Java JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar Capacitor
      - name: Instalar dependencias de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Inicializar y sincronizar usando la carpeta www
      - name: Inicializar Capacitor y Agregar Plataforma Android
        run: |
          npx cap init "Meow CF App" "com.meowcf.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      # 7. Permisos de Gradle
      - name: Permisos Gradle
        run: chmod +x android/gradlew

      # 8. Compilar la APK en modo Debug
      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 9. Subir la APK generada
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
