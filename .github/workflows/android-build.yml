name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Configurar Java JDK 21 (Requerido por las últimas versiones de Capacitor)
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Aceptar licencias Android
      - name: Aceptar licencias Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Instalar dependencias de Capacitor
      - name: Instalar dependencias de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Inicializar y sincronizar Capacitor
      - name: Inicializar Capacitor y Agregar Plataforma Android
        run: |
          npx cap init "Meow CF App" "com.meowcf.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      # 7. Permisos de Gradle
      - name: Permisos Gradle
        run: chmod +x android/gradlew

      # 8. Compilar APK
      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true

      # 9. Subir la APK generada como artefacto
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
